<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>縁起とフラクタル｜Engi × Fractal</title>
<meta name="description" content="今の悩み、過去の記憶、社会での違和感。バラバラに見える点が、実は一つの形として重なっていることに気づいた時、縁は静かに繋がりはじめる。縁起とフラクタル。">
<meta property="og:type" content="website">
<meta property="og:title" content="縁起とフラクタル｜Engi × Fractal">
<meta property="og:description" content="今の悩み、過去の記憶、社会での違和感。バラバラに見える点が、実は一つの形として重なっていることに気づいた時、縁は静かに繋がりはじめる。">
<meta property="og:image" content="assets/video-poster.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Old+Mincho:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2e33;
    --ink-soft:#5a5f66;
    --paper:#fdfdfc;
    --line:#d9d9d6;

    --c1:#c96f4a;
    --c2:#a68a3c;
    --c3:#3f8f8a;
    --c4:#9c7752;
    --c5:#3c5a78;
    --c6:#2f8f83;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans JP","Zen Old Mincho",serif;
    -webkit-font-smoothing:antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  /* ---------- HERO (ロゴ被り防止の余白構造を適用) ---------- */
  .hero{
    position:relative;
    width:100%;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    /* 上下均等パディング。スクロール線は絶対配置なのでフローに影響しない */
    padding:2rem 1.5rem;
    background:#e9e9e7 url("assets/bg-wave.jpg") center 60% / cover no-repeat;
    overflow:hidden;
  }

  .hero-bgvideo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }

  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
    background:linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0.65) 100%);
    pointer-events:none;
  }

  /* ロゴコンテナ */
  .logotype{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    margin-top:22vh;
    opacity:0;
    animation:fadeIn 1.2s ease-out 0.2s forwards;
  }

  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ロゴ画像:サイズと最大高さを制御して被りを防止 */
  .signature-logo{
    width:clamp(85px, 13vw, 150px);
    max-height:26vh;
    height:auto;
    display:block;
    margin:0 auto;
    object-fit:contain;
  }

  /* スクロール線:Hero下部のセーフエリア内に固定配置 */
  .scroll-cue{
    position:absolute;
    bottom:1.5rem;
    left:50%;
    transform:translateX(-50%);
    width:1px;
    height:40px;
    background:linear-gradient(180deg, rgba(43,46,51,0) 0%, rgba(43,46,51,.4) 60%, rgba(43,46,51,0) 100%);
    z-index:2;
  }

  .scroll-cue::after{
    content:"";
    position:absolute;
    top:0;
    left:50%;
    width:4px;
    height:4px;
    border-radius:50%;
    background:var(--ink-soft);
    transform:translateX(-50%);
    animation:cueMove 2.5s ease-in-out infinite;
  }

  @keyframes cueMove{
    0%{ top:0; opacity:0; }
    20%{ opacity:1; }
    80%{ opacity:1; }
    100%{ top:36px; opacity:0; }
  }

  /* ---------- STATEMENT ---------- */
  .statement{
    position:relative;
    padding:6rem 1.5rem 4rem;
    text-align:center;
    background:var(--paper);
  }

  .statement h2{
    font-family:"Shippori Mincho", serif;
    font-weight:600;
    font-size:clamp(1.1rem, 2.2vw, 1.3rem);
    letter-spacing:.16em;
    color:var(--ink);
    margin:0 0 1.6rem;
  }

  .statement-lead{
    font-family:"Zen Maru Gothic", sans-serif;
    font-weight:500;
    font-size:clamp(1.1rem, 2.4vw, 1.3rem);
    color:var(--c6);
    letter-spacing:.03em;
    margin:0 0 3rem;
  }

  .statement .lines{
    display:flex;
    flex-direction:column;
    gap:.9rem;
    max-width:640px;
    margin:0 auto;
    font-family:"Zen Old Mincho", serif;
    font-size:clamp(.98rem, 1.6vw, 1.1rem);
    letter-spacing:.06em;
    line-height:1.8;
  }

  .statement .lines p{
    margin:0;
    color:var(--ink);
  }

  .statement .lines p:last-child{
    font-weight:600;
  }

  .divider{
    width:100%;
    max-width:960px;
    height:1px;
    background:var(--line);
    margin:3.5rem auto 2rem;
  }

  .story-link{
    display:inline-block;
    font-family:"Noto Sans JP", sans-serif;
    font-size:.85rem;
    letter-spacing:.08em;
    color:var(--ink-soft);
    text-decoration:none;
    border-bottom:1px solid var(--ink-soft);
    padding-bottom:2px;
    transition:color .25s ease, border-color .25s ease;
  }

  .story-link:hover{
    color:var(--c6);
    border-color:var(--c6);
  }

  .story-link--sub{
    margin-top:1rem;
    font-size:.92rem;
    opacity:.8;
  }

  /* ---------- VIDEO BLOCK ---------- */
  .video-block{
    position:relative;
    padding:2rem 1.5rem 6rem;
    background:var(--paper);
    text-align:center;
  }

  .video-block .video-caption{
    font-family:"Noto Sans JP", sans-serif;
    font-size:.75rem;
    letter-spacing:.28em;
    color:var(--ink-soft);
    opacity:.6;
    margin:0 0 1.5rem;
  }

  .video-frame{
    position:relative;
    max-width:820px;
    margin:0 auto;
    border-radius:16px;
    overflow:hidden;
    background:#1c1d20;
    box-shadow:0 30px 60px -25px rgba(43,46,51,.25);
    aspect-ratio:16/9;
  }

  .video-frame video{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  /* ---------- BINOJP EMBED (mindfulness / philosophy) ---------- */
  .binojp-block{
    position:relative;
    padding:1rem 1.5rem 6rem;
    background:var(--paper);
    text-align:center;
  }

  .binojp-block .video-caption{
    margin-bottom:1.5rem;
  }

  .binojp-frame{
    position:relative;
    max-width:820px;
    height:82vh;
    margin:0 auto;
    border-radius:16px;
    overflow:hidden;
    background:#fdfdfc;
    box-shadow:0 30px 60px -25px rgba(43,46,51,.25);
  }

  .binojp-frame iframe{
    display:block;
    width:100%;
    height:100%;
    border:0;
  }

  .binojp-open{
    display:inline-block;
    margin-top:1.4rem;
    font-family:"Noto Sans JP", sans-serif;
    font-size:.82rem;
    letter-spacing:.06em;
    color:var(--ink-soft);
    text-decoration:none;
    border-bottom:1px solid var(--ink-soft);
    padding-bottom:2px;
    opacity:.75;
    transition:color .25s ease, border-color .25s ease, opacity .25s ease;
  }

  .binojp-open:hover{
    color:var(--c6);
    border-color:var(--c6);
    opacity:1;
  }

  /* ---------- FOOTER ---------- */
  footer{
    padding:5rem 1.5rem 3rem;
    text-align:center;
    font-family:"Cormorant Garamond", serif;
    font-style:italic;
    color:var(--ink-soft);
    font-size:.9rem;
    letter-spacing:.08em;
    background:var(--paper);
  }
</style>
</head>
<body>

  <!-- HERO SECTION -->
  <section class="hero">
    <video class="hero-bgvideo" id="heroVideo" autoplay muted loop playsinline poster="assets/bg-wave.jpg">
      <source src="assets/hero-bg-loop.mp4" type="video/mp4">
    </video>
    <div class="logotype">
      <img class="signature-logo" src="assets/engi_fractal_logo.png" alt="Engi × Fractal">
    </div>
    <div class="scroll-cue" aria-hidden="true"></div>
  </section>

  <!-- STATEMENT SECTION -->
  <section class="statement">
    <h2>縁起とフラクタル</h2>
    <p class="statement-lead">人生100年、どうつながる？</p>
    <div class="lines">
      <p>今の悩み、過去の記憶、社会での違和感</p>
      <p>バラバラに見える点が</p>
      <p>実は一つの形として重なり</p>
      <p>起こっていることに気づいた時</p>
      <p>縁は静かに</p>
      <p>繋がりはじめる</p>
    </div>
    <div class="divider"></div>
    <a class="story-link" href="https://note.com/fractal_hiiro" target="_blank" rel="noopener">ブランディングストーリーはこちら</a>
    <br>
    <a class="story-link story-link--sub" href="https://nanbasuri891-maker.github.io/binojp/" target="_blank" rel="noopener">Read the philosophy in English →</a>
  </section>

  <!-- BI-NŌ PHILOSOPHY (embedded) -->
  <section class="binojp-block">
    <p class="video-caption">PHILOSOPHY — BI-NŌ 美脳</p>
    <div class="binojp-frame">
      <iframe src="https://nanbasuri891-maker.github.io/binojp/" loading="lazy" title="Bi-nō 美脳 — A Mind That Reflects, Not Distorts"></iframe>
    </div>
    <a class="binojp-open" href="https://nanbasuri891-maker.github.io/binojp/" target="_blank" rel="noopener">全画面で読む / Open full page →</a>
  </section>

  <!-- STORY VIDEO SECTION -->
  <section class="video-block">
    <p class="video-caption">STORY</p>
    <div class="video-frame">
      <video controls playsinline poster="assets/video-poster.jpg">
        <source src="assets/story-video.mp4" type="video/mp4">
        お使いのブラウザは動画に対応していません。
      </video>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>Engi × Fractal</footer>

  <!-- JS: 背景動画のスロー再生 -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var heroVideo = document.getElementById('heroVideo');
      if (heroVideo) {
        heroVideo.muted = true;
        heroVideo.playbackRate = 0.5;
        var promise = heroVideo.play();
        if (promise !== undefined) {
          promise.catch(function(error) {
            console.log("Autoplay failed:", error);
          });
        }
      }
    });
  </script>

</body>
</html>
