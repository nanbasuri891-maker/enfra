<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>縁起とフラクタル｜Engi × Fractal</title>
<meta name="description" content="今の悩み、過去の記憶、社会での違和感。バラバラに見える点が、実は一つの形として重なっていることに気づいた時、縁は静かに繋がりはじめる。縁起とフラクタル。">
<meta property="og:type" content="website">
<meta property="og:title" content="縁起とフラクタル｜Engi × Fractal">
<meta property="og:description" content="今の悩み、過去の記憶、社会での違和感。バラバラに見える点が、実は一つの形として重なっていることに気づいた時、縁は静かに繋がりはじめる。">
<meta property="og:image" content="assets/video-poster.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Old+Mincho:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2e33;
    --ink-soft:#5a5f66;
    --paper:#fdfdfc;
    --line:#d9d9d6;

    /* signature palette — points scattered, then joined by 縁 */
    --c1:#c96f4a; /* coral / 今の悩み */
    --c2:#a68a3c; /* olive gold / バラバラ */
    --c3:#3f8f8a; /* teal / 実は一つの形 */
    --c4:#9c7752; /* umber / 起こっていること */
    --c5:#3c5a78; /* navy / 縁は静かに */
    --c6:#2f8f83; /* deep teal / 繋がりはじめる */
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans JP","Zen Old Mincho",serif;
    -webkit-font-smoothing:antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:92vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e9e9e7 url("assets/bg-wave.jpg") center 60% / cover no-repeat;
    overflow:hidden;
  }
  .hero-bgvideo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    z-index:1;
    background:linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0.55) 100%);
    pointer-events:none;
  }

  .logotype{
    position:relative;
    z-index:2;
    text-align:center;
    opacity:0;
    animation:riseIn 1.4s cubic-bezier(.16,.9,.28,1) 0.2s forwards;
  }
  @keyframes riseIn{
    from{opacity:0; transform:translateY(18px);}
    to{opacity:1; transform:translateY(0);}
  }

  .kanji-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    line-height:1;
    font-family:"Shippori Mincho", serif;
    color:var(--ink);
  }
  .kanji-block .row1{
    display:flex;
    align-items:baseline;
    gap:.15em;
  }
  .kanji-block .en{ font-size:clamp(3.4rem, 8vw, 6.2rem); font-weight:600; }
  .kanji-block .ki{ font-size:clamp(1.6rem, 3.4vw, 2.4rem); font-weight:500; margin-left:.05em; }
  .kanji-block .to{ font-size:clamp(1.6rem, 3.4vw, 2.4rem); font-weight:500; }
  .kanji-block .fractal-jp{
    margin-top:.15em;
    font-size:clamp(1.9rem, 4vw, 2.9rem);
    font-weight:500;
    letter-spacing:.02em;
  }

  /* ロゴ飛びの原因となっていた余計なmargin-topを修正 */
  .logotype--signature-only{
    margin-top:0;
  }
  .signature-logo{
    width:clamp(70px, 9vw, 110px);
    height:auto;
    display:block;
    margin:0 auto;
    opacity:.85;
  }
  .signature{
    margin-top:1.6rem;
    font-family:"Cormorant Garamond", serif;
    font-style:italic;
    font-weight:400;
    color:var(--ink-soft);
    font-size:clamp(1.05rem, 2vw, 1.35rem);
    display:flex;
    flex-direction:column;
    align-items:center;
    letter-spacing:.03em;
  }
  .signature .x{
    margin:.35rem 0;
    font-style:normal;
    font-size:1rem;
    opacity:.55;
  }

  .scroll-cue{
    position:absolute;
    bottom:2.2rem; left:50%;
    transform:translateX(-50%);
    width:1px; height:52px;
    background:linear-gradient(180deg, rgba(43,46,51,0) 0%, rgba(43,46,51,.45) 60%, rgba(43,46,51,0) 100%);
    z-index:2;
  }
  .scroll-cue::after{
    content:"";
    position:absolute;
    top:0; left:50%;
    width:5px; height:5px;
    border-radius:50%;
    background:var(--ink-soft);
    transform:translateX(-50%);
    animation:cueMove 2.6s ease-in-out infinite;
  }
  @keyframes cueMove{
    0%{ top:0; opacity:0;}
    15%{opacity:1;}
    85%{opacity:1;}
    100%{ top:46px; opacity:0;}
  }

  /* ---------- INTRO / STATEMENT ---------- */
  .statement{
    position:relative;
    padding:5.5rem 1.5rem 4rem;
    text-align:center;
    background:var(--paper);
  }
  .statement h2{
    font-family:"Shippori Mincho", serif;
    font-weight:600;
    font-size:clamp(1.05rem, 2vw, 1.2rem);
    letter-spacing:.14em;
    color:var(--ink);
    margin:0 0 2.6rem;
  }
  .statement .lines{
    display:flex;
    flex-direction:column;
    gap:.85rem;
    max-width:640px;
    margin:0 auto;
    font-family:"Zen Old Mincho", serif;
    font-size:clamp(.95rem, 1.6vw, 1.08rem);
    letter-spacing:.06em;
  }
  .statement .lines p{
    margin:0;
    opacity:0;
    transform:translateY(10px);
    animation:lineIn .9s ease forwards;
  }
  .lines p{ color:var(--ink); }
  .lines p:nth-child(1){ animation-delay:.05s; }
  .lines p:nth-child(2){ animation-delay:.18s; }
  .lines p:nth-child(3){ animation-delay:.31s; }
  .lines p:nth-child(4){ animation-delay:.44s; }
  .lines p:nth-child(5){ animation-delay:.57s; }
  .lines p:nth-child(6){ animation-delay:.70s; font-weight:500;}
  @keyframes lineIn{ to{ opacity:1; transform:translateY(0);} }

  .divider{
    width:100%;
    max-width:960px;
    height:1px;
    background:var(--line);
    margin:3rem auto 1.6rem;
  }

  .story-link{
    display:inline-block;
    font-family:"Noto Sans JP", sans-serif;
    font-size:.85rem;
    letter-spacing:.08em;
    color:var(--ink-soft);
    text-decoration:none;
    border-bottom:1px solid var(--ink-soft);
    padding-bottom:2px;
    transition:color .25s ease, border-color .25s ease, opacity .25s ease;
  }
  .story-link:hover{ color:var(--c6); border-color:var(--c6); }

  footer{
    position:relative;
    padding:5.5rem 1.5rem 2.8rem;
    text-align:center;
    font-family:"Cormorant Garamond", serif;
    font-style:italic;
    color:var(--ink-soft);
    font-size:.85rem;
    letter-spacing:.06em;
    background:var(--paper);
    overflow:hidden;
  }
  footer::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:0;
    background:
      radial-gradient(50% 60% at 15% 0%, rgba(224,142,110,.22) 0%, rgba(224,142,110,0) 65%),
      radial-gradient(55% 65% at 85% 10%, rgba(63,143,138,.18) 0%, rgba(63,143,138,0) 65%),
      linear-gradient(180deg, rgba(238,194,163,.35) 0%, rgba(253,253,252,0) 55%);
    pointer-events:none;
  }
  footer > *{
    position:relative;
    z-index:1;
  }

  /* ---------- VIDEO BLOCK ---------- */
  .video-block{
    position:relative;
    padding:0 1.5rem 6rem;
    background:var(--paper);
    text-align:center;
  }
  .video-block .video-caption{
    font-family:"Noto Sans JP", sans-serif;
    font-size:.72rem;
    letter-spacing:.28em;
    color:var(--ink-soft);
    opacity:.6;
    margin:0 0 1.4rem;
  }
  .video-frame{
    position:relative;
    max-width:820px;
    margin:0 auto;
    border-radius:20px;
    overflow:hidden;
    background:#1c1d20;
    box-shadow:0 40px 80px -35px rgba(43,46,51,.4);
    aspect-ratio:16/9;
  }
  .video-frame video{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  /* ---------- HIIRO SPACE ---------- */
  :root{
    --warm1:#f6ddc9;
    --warm2:#f0b99a;
    --warm3:#e08e6e;
    --warm-ink:#5c3b2e;
  }
  .hiiro-section{
    position:relative;
    padding:6.5rem 1.5rem 7rem;
    overflow:hidden;
    background:
      radial-gradient(60% 55% at 22% 20%, rgba(240,185,154,.65) 0%, rgba(240,185,154,0) 60%),
      radial-gradient(55% 60% at 82% 78%, rgba(224,142,110,.55) 0%, rgba(224,142,110,0) 65%),
      linear-gradient(155deg, #fbf1e8 0%, #f6ddc9 45%, #eec2a3 100%);
  }
  .hiiro-section::before{
    content:"";
    position:absolute; inset:0 0 auto 0; height:5rem;
    background:linear-gradient(180deg, var(--paper) 0%, rgba(253,253,252,0) 100%);
    pointer-events:none;
  }
  .hiiro-glow{
    position:absolute;
    width:520px; height:520px;
    border-radius:50%;
    top:-140px; right:-120px;
    background:radial-gradient(circle, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 70%);
    filter:blur(10px);
    pointer-events:none;
  }

  .hiiro-card{
    position:relative;
    z-index:1;
    max-width:640px;
    margin:0 auto;
    padding:3.4rem 2.6rem;
    text-align:center;
    background:rgba(255,255,255,.38);
    border:1px solid rgba(255,255,255,.65);
    border-radius:28px;
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    box-shadow:0 40px 80px -30px rgba(140,80,50,.35), inset 0 1px 0 rgba(255,255,255,.7);
  }

  .hiiro-avatar{
    width:88px; height:88px;
    margin:0 auto 1.8rem;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffcba8 0%, var(--warm3) 55%, #c96a44 100%);
    box-shadow:0 14px 30px -10px rgba(192,90,50,.55), inset 0 2px 6px rgba(255,255,255,.5);
    display:flex; align-items:center; justify-content:center;
  }
  .hiiro-avatar span{
    font-family:"Shippori Mincho", serif;
    font-size:1.9rem;
    font-weight:600;
    color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.15);
  }

  .hiiro-eyebrow{
    font-family:"Noto Sans JP", sans-serif;
    font-size:.72rem;
    letter-spacing:.28em;
    color:var(--warm-ink);
    opacity:.7;
    margin:0 0 1rem;
  }

  .hiiro-name{
    font-family:"Shippori Mincho", serif;
    font-weight:600;
    font-size:clamp(2.2rem, 5vw, 2.9rem);
    color:var(--warm-ink);
    margin:0;
    letter-spacing:.04em;
  }

  .hiiro-tagline{
    font-family:"Cormorant Garamond", serif;
    font-style:italic;
    font-size:1.15rem;
    color:var(--warm3);
    margin:.4rem 0 1.8rem;
    letter-spacing:.05em;
  }

  .hiiro-copy{
    font-family:"Zen Old Mincho", serif;
    font-size:1rem;
    line-height:2;
    color:var(--warm-ink);
    max-width:440px;
    margin:0 auto 2.4rem;
  }

  .hiiro-cta{
    display:inline-flex;
    align-items:center;
    gap:.6rem;
    padding:.95rem 2.4rem;
    border-radius:999px;
    background:linear-gradient(135deg, var(--warm3), #c9663f);
    color:#fff;
    text-decoration:none;
    font-family:"Noto Sans JP", sans-serif;
    font-size:.9rem;
    letter-spacing:.08em;
    box-shadow:0 16px 32px -12px rgba(192,90,50,.55);
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .hiiro-cta:hover{
    transform:translateY(-2px);
    box-shadow:0 20px 40px -14px rgba(192,90,50,.65);
  }
  .hiiro-cta .arrow{
    transition:transform .3s ease;
  }
  .hiiro-cta:hover .arrow{ transform:translateX(3px); }
  .hiiro-cta:focus-visible,
  .story-link:focus-visible{
    outline:2px solid var(--c6);
    outline-offset:3px;
  }
</style>
</head>
<body>

  <!-- HERO SECTION: 背景動画と中央配置されたロゴ -->
  <section class="hero">
    <video class="hero-bgvideo" autoplay muted loop playsinline poster="assets/bg-wave.jpg">
      <source src="assets/hero-bg-loop.mp4" type="video/mp4">
    </video>
    <div class="logotype logotype--signature-only">
      <img class="signature-logo" src="assets/engi_fractal_logo.png" alt="Engi × fractal">
    </div>
    <div class="scroll-cue" aria-hidden="true"></div>
  </section>

  <!-- STATEMENT SECTION -->
  <section class="statement">
    <h2>縁起とフラクタル</h2>
    <div class="lines">
      <p>今の悩み、過去の記憶、社会での違和感</p>
      <p>バラバラに見える点が</p>
      <p>実は一つの形として重なり</p>
      <p>起こっていることに気づいた時</p>
      <p>縁は静かに</p>
      <p>繋がりはじめる</p>
    </div>
    <div class="divider"></div>
    <a class="story-link" href="https://note.com/fractal_hiiro" target="_blank" rel="noopener">ブランディングストーリーはこちら</a>
  </section>

  <!-- VIDEO BLOCK: 下部の再生ボックスに動画ソースを追加 -->
  <section class="video-block">
    <p class="video-caption">STORY</p>
    <div class="video-frame">
      <video controls playsinline poster="assets/video-poster.jpg">
        <source src="assets/story-video.mp4" type="video/mp4">
        お使いのブラウザは動画に対応していません。
      </video>
    </div>
  </section>

  <!-- HIIRO SPACE (そのまま保持) -->
  <section class="hiiro-section" id="hiiro">
    <div class="hiiro-glow" aria-hidden="true"></div>
    <div class="hiiro-card">
      <div class="hiiro-avatar" aria-hidden="true"><span>緋</span></div>
      <p class="hiiro-eyebrow">AI COMPANION</p>
      <h2 class="hiiro-name">緋色</h2>
      <p class="hiiro-tagline">そばにいます</p>
      <p class="hiiro-copy">
        気づいたことを、言葉にしてみる相手が欲しい時。<br>
        緋色は、判断せずにそこにいます。<br>
        話した分だけ、輪郭が見えてくることがあります。
      </p>
      <a class="hiiro-cta" href="https://nanbasuri891-maker.github.io/hiiro2/" target="_blank" rel="noopener">
        <span>緋色と話してみる</span>
        <span class="arrow">→</span>
      </a>
    </div>
  </section>

  <!-- FOOTER (そのまま保持) -->
  <footer>Engi × Fractal</footer>

  <!-- 背景動画の再生を確実に発火させるスクリプト -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var heroVideo = document.querySelector('.hero-bgvideo');
      if (heroVideo) {
        heroVideo.muted = true;
        heroVideo.playbackRate = 0.6;
        var promise = heroVideo.play();
        if (promise !== undefined) {
          promise.catch(function(error) {
            console.log("Autoplay failed:", error);
          });
        }
      }
    });
  </script>

</body>
</html>
